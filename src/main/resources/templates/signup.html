<form method="post" th:action="@{/signup}">

    <div>
        <label for="username">아이디</label>
        <input id="username"
               name="username"
               required
               type="text">

        <button id="checkUsernameBtn" type="button">
            중복 확인
        </button>

        <span id="usernameCheckResult"></span>
    </div>

    <div>
        <label for="password">비밀번호</label>
        <input id="password"
               name="password"
               required
               type="password">
    </div>

    <!-- 처음에는 비활성화 -->
    <button disabled id="signupBtn" type="submit">
        가입
    </button>
</form>

<script>
    const usernameInput = document.getElementById("username");
    const checkButton = document.getElementById("checkUsernameBtn");
    const signupButton = document.getElementById("signupBtn");
    const result = document.getElementById("usernameCheckResult");

    checkButton.addEventListener("click", function () {

        const username = usernameInput.value;

        fetch("/check-username?username=" + encodeURIComponent(username))
            .then(response => response.json())
            .then(exists => {

                if (exists) {
                    result.textContent = "이미 사용 중인 아이디입니다.";
                    signupButton.disabled = true;
                } else {
                    result.textContent = "사용 가능한 아이디입니다.";
                    signupButton.disabled = false;
                }
            });
    });

    // 중복 확인 후 username을 변경하면 다시 비활성화
    usernameInput.addEventListener("input", function () {
        signupButton.disabled = true;
        result.textContent = "아이디 중복 확인이 필요합니다.";
    });
</script>
