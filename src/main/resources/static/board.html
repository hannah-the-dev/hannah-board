<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 | Hannah Board</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/" aria-label="Hannah Board 홈">Hannah Board</a>
    <button class="menu-button" type="button" aria-label="메뉴 열기" aria-controls="sideMenu" aria-expanded="false">
        <span class="menu-icon" aria-hidden="true"></span>
    </button>
</header>

<div class="menu-overlay"></div>
<aside class="side-menu" id="sideMenu" aria-label="주 메뉴">
    <nav>
        <a href="/">홈</a>
        <a href="/user/1">내 정보</a>
        <a href="/board/list" aria-current="page">게시판</a>
    </nav>
</aside>

<main class="board-shell">
    <section class="board-heading" aria-labelledby="pageTitle">
        <div>
            <p class="eyebrow">Community</p>
            <h1 id="pageTitle">게시판</h1>
            <p>새로운 이야기와 생각을 만나보세요.</p>
        </div>
        <a class="primary-button board-write-button" href="/post/write">글쓰기</a>
    </section>

    <section class="post-list" aria-label="게시글 목록">
        <a class="post-card" href="/post/3">
            <span class="post-number">03</span>
            <span class="post-main"><strong>오늘의 작은 기록</strong><span>2026-10-01 10:20</span></span>
            <span class="post-hits">조회 12</span>
        </a>
        <a class="post-card" href="/post/2">
            <span class="post-number">02</span>
            <span class="post-main"><strong>Hannah Board에 오신 것을 환영합니다</strong><span>2026-09-30 16:40</span></span>
            <span class="post-hits">조회 8</span>
        </a>
        <a class="post-card" href="/post/1">
            <span class="post-number">01</span>
            <span class="post-main"><strong>게시판 사용 안내</strong><span>2026-09-30 09:00</span></span>
            <span class="post-hits">조회 5</span>
        </a>
    </section>

    <nav class="pagination" aria-label="게시판 페이지 이동">
        <a href="/board/list?page=1" aria-label="첫 페이지">«</a>
        <a href="/board/list?page=1" aria-current="page">1</a>
        <a href="/board/list?page=2">2</a>
        <a href="/board/list?page=2" aria-label="다음 페이지">»</a>
    </nav>
</main>

<script>
    const menuButton = document.querySelector('.menu-button');
    const sideMenu = document.querySelector('#sideMenu');
    const overlay = document.querySelector('.menu-overlay');
    function closeMenu() {
        sideMenu.classList.remove('is-open');
        overlay.classList.remove('is-visible');
        menuButton.setAttribute('aria-expanded', 'false');
        menuButton.setAttribute('aria-label', '메뉴 열기');
    }
    menuButton.addEventListener('click', () => {
        const isOpen = sideMenu.classList.toggle('is-open');
        overlay.classList.toggle('is-visible', isOpen);
        menuButton.setAttribute('aria-expanded', String(isOpen));
        menuButton.setAttribute('aria-label', isOpen ? '메뉴 닫기' : '메뉴 열기');
    });
    overlay.addEventListener('click', closeMenu);
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeMenu();
    });
</script>
</body>
</html>
